[project]
name = "codesight-ai"
version = "0.1.0"
description = "Autonomous PR Reviewer & Technical Debt Radar"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "redis>=5.2",
    "rich>=13.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "typer>=0.13",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
codesight = "codesight.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesight"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asyncpg.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/codesight"]
branch = true
concurrency = ["greenlet", "thread"]
